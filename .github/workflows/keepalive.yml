name: Keepalive Ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive-ping
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://ads.hexistoree.click
    steps:
      - name: Warm up login page
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 90 \
            --header 'User-Agent: keepalive-bot/1.0' \
            "$BASE_URL/login" > /dev/null

      - name: Verify AI endpoint is reachable
        run: |
          curl --fail --show-error --silent \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 90 \
            --header 'Content-Type: application/json' \
            --data '{"message":"ping","history":[{"role":"user","content":"ping"}]}' \
            "$BASE_URL/api/ai/chat" > /dev/null
