name: Keepalive Ping

on:
  schedule:
    - cron: '*/5 * * * *'
    # Offset second schedule to reduce gaps when GitHub cron is delayed.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive-ping
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://ads.hexistoree.click
      FALLBACK_URL: https://chi-phi-ads-dashboard.onrender.com
    steps:
      - name: Ping liveness endpoints
        run: |
          set -euo pipefail

          ping_url () {
            local base="$1"
            local path="$2"
            curl --fail --show-error --silent \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 120 \
              --header 'User-Agent: keepalive-bot/1.0' \
              "${base}${path}" > /dev/null
          }

          ping_url "$BASE_URL" "/healthz"
          ping_url "$BASE_URL" "/login"

      - name: Ping fallback Render domain
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 120 \
            --header 'User-Agent: keepalive-bot/1.0' \
            "$FALLBACK_URL/healthz" > /dev/null
